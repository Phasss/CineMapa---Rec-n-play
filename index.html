<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, viewport-fit=cover" />
  <title>Cinemapa do Recife Antigo</title>
  <meta name="description" content="Mapa interativo de locações de filmagem nas ilhas do Recife Antigo e de Santo Antônio, no Centro do Recife." />
  <meta name="theme-color" content="#122a5c" />

  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%8E%9E%EF%B8%8F%3C/text%3E%3C/svg%3E" />

  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="css/style.css" />
</head>
<body>

  <header class="site-header">
    <div class="header-inner">
      <div class="brand-logos">
        <img class="logo-recife" src="assets/logo-recife-e-pra-ficar.png" alt="Recife é pra ficar — Secretaria de Turismo e Lazer" />
        <img class="logo-observatorio" src="assets/logo-observatorio-turismo.png" alt="Observatório de Turismo do Recife" />
      </div>
      <div class="brand-text">
        <h1>Cinemapa do Recife Antigo</h1>
        <p class="subtitle">Locações de cinema no Recife Antigo e em Santo Antônio</p>
      </div>
    </div>
  </header>

  <main>
    <section class="toolbar">
      <div class="toolbar-inner">
        <div class="search-box">
          <label for="search" class="visually-hidden">Buscar filme</label>
          <input type="search" id="search" placeholder="Buscar por filme ou local..." autocomplete="off" />
        </div>

        <div class="filters" role="group" aria-label="Filtrar por ilha">
          <button class="filter-btn is-active" data-island="all">Todas as ilhas</button>
          <button class="filter-btn" data-island="recife-antigo">
            <span class="dot dot--recife-antigo"></span> Recife Antigo
          </button>
          <button class="filter-btn" data-island="santo-antonio">
            <span class="dot dot--santo-antonio"></span> Santo Antônio
          </button>
        </div>

        <div class="result-count" id="resultCount" aria-live="polite"></div>
      </div>
    </section>

    <section class="map-layout">
      <aside class="sidebar" id="sidebar" aria-label="Lista de locações">
        <div class="sidebar-header">
          <h2>Locais no mapa</h2>
          <button type="button" class="sidebar-close" id="sidebarClose" aria-label="Voltar ao mapa">&times;</button>
        </div>
        <ul class="location-list" id="locationList"></ul>
      </aside>

      <div class="map-wrap">
        <div id="map"></div>
      </div>

      <div class="tab-switcher" id="tabSwitcher">
        <button type="button" class="tab-btn is-active" data-tab="mapa" aria-pressed="true">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polygon points="3 6 9 3 15 6 21 3 21 18 15 21 9 18 3 21"/><line x1="9" y1="3" x2="9" y2="18"/><line x1="15" y1="6" x2="15" y2="21"/></svg>
          Mapa
        </button>
        <button type="button" class="tab-btn" data-tab="lista" aria-pressed="false">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><line x1="8" y1="6" x2="21" y2="6"/><line x1="8" y1="12" x2="21" y2="12"/><line x1="8" y1="18" x2="21" y2="18"/><line x1="3" y1="6" x2="3.01" y2="6"/><line x1="3" y1="12" x2="3.01" y2="12"/><line x1="3" y1="18" x2="3.01" y2="18"/></svg>
          Lista
        </button>
      </div>
    </section>
  </main>

  <!-- Painel de detalhes (abre ao clicar num marcador ou item da lista) -->
  <div class="detail-overlay" id="detailOverlay" hidden>
    <div class="detail-panel" role="dialog" aria-modal="true" aria-labelledby="detailTitle">
      <div class="detail-header">
        <div class="detail-header-text">
          <span class="detail-badge" id="detailIsland"></span>
          <h2 id="detailTitle"></h2>
          <p class="detail-meta" id="detailMeta"></p>
        </div>
        <button class="detail-close" id="detailClose" aria-label="Fechar">&times;</button>
      </div>

      <div class="detail-body">
        <span class="island-tag" id="detailIslandTag">
          <span class="dot" id="detailIslandDot"></span>
          <span id="detailIslandLabel"></span>
        </span>

        <p class="detail-synopsis" id="detailSynopsis"></p>

        <div class="detail-video" id="detailVideoWrap">
          <a class="video-row" id="detailVideoLink" href="#" target="_blank" rel="noopener">
            <span class="video-row-icon" aria-hidden="true">▶</span>
            <span class="video-row-text">
              <span class="video-row-title">Assistir trecho</span>
              <span class="video-row-sub">Abre o vídeo do filme em nova aba</span>
            </span>
          </a>
          <div class="video-embed" id="detailVideoEmbed" hidden></div>
          <p class="video-empty" id="detailVideoEmpty" hidden>Trecho de vídeo ainda não cadastrado para este local.</p>
        </div>

        <dl class="detail-credits" id="detailCredits">
          <div class="credit-row" id="detailDirectorRow">
            <dt>Direção</dt>
            <dd id="detailDirector"></dd>
          </div>
          <div class="credit-row" id="detailScreenwriterRow">
            <dt>Roteiro</dt>
            <dd id="detailScreenwriter"></dd>
          </div>
          <div class="credit-row" id="detailReleaseRow">
            <dt>Lançamento</dt>
            <dd id="detailRelease"></dd>
          </div>
        </dl>

        <p class="detail-notes" id="detailNotes"></p>
      </div>

      <div class="detail-footer">
        <a class="btn btn-primary" id="detailDirections" href="#" target="_blank" rel="noopener">
          🚶 Traçar rota a pé
        </a>
      </div>
    </div>
  </div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
  <script src="js/data.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
